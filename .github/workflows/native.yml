name: Native checks and artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          version: '0.11.8'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Toolchain
        run: |
          swift --version
          xcrun swift-format --version
          uv --version
      - name: Install verified development tools
        run: make -C apps/ez tools
      - name: Commit hooks (all tracked files)
        run: bash scripts/pre-commit.sh run --all-files
      - name: Push gate (build, static checks, offline contracts)
        run: pnpm check:ez
      - name: Package development app
        run: |
          make -C apps/ez app
          ditto -c -k --sequesterRsrc --keepParent apps/ez/dist/EZ.app apps/ez/dist/EZ-macos.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-development-app
          path: apps/ez/dist/EZ-macos.zip
          if-no-files-found: error
          retention-days: 14
