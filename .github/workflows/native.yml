name: Native checks and artifact
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          version: '0.11.8'
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Toolchain
        run: |
          swift --version
          xcrun swift-format --version
          uv --version
      - name: Install verified development tools
        run: make -C apps/ez tools
      - name: Commit hooks (all tracked files)
        run: bash scripts/pre-commit.sh run --all-files
      - name: Push gate (build, static checks, offline contracts)
        run: pnpm check:ez
      - name: Package development app
        run: |
          make -C apps/ez app
          ditto -c -k --sequesterRsrc --keepParent apps/ez/dist/EZ.app apps/ez/dist/EZ-macos.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-development-app
          path: apps/ez/dist/EZ-macos.zip
          if-no-files-found: error
          retention-days: 14
