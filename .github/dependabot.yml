version: 2
updates:
  - package-ecosystem: npm
    # Scan the pnpm workspace once, using its shared lockfile.
    directory: /
    ignore:
      # Keep Node types aligned with the runtime pinned in .node-version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    schedule:
      interval: weekly
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
